[package]
name = "dreamd"
version = "0.1.0"
edition = "2021"
description = "Local dream machine: out-of-band consolidation of Claude Code auto-memory"
license = "MIT"
repository = "https://github.com/Dev916/dreamd"
readme = "README.md"
keywords = ["claude", "memory", "cli"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "dreamd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
walkdir = "2"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
dirs = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
getrandom = "0.3"

[dev-dependencies]
filetime = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
assert_cmd = "2"
predicates = "3"
